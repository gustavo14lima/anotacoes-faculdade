<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let nomes = ["Bob", "Tom", "Mel", "Ana", "Dan"];

        console.log(`Nomes da lista: ${nomes}`);
        
        // removendo elementos
        // splice(indice, quantidade) -> remove a partir do indice um, dois elementos
        nomes.splice(2, 2); // neste exemplo, estou removendo dois elementos a partir do indice dois
        console.log(`Nomes da lista: ${nomes}`);

        let numeros = [10, 20, 30 ,50]
        console.log(numeros.join(5));
        

    </script>

</body>
</html>

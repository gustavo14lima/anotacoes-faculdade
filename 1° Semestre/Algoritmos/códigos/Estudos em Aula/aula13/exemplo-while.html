<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div id="div_resultado"></div>

    <script>
        let contador = 0;

        // enquanto o contador for menor ou igual a 9, faça 
        while (contador <= 9){
            div_resultado.innerHTML += `Contador é ${contador}`;
            contador ++;
        };
    </script>

</body>
</html>

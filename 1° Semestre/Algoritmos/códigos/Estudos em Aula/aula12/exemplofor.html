<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_valor">
    <button onclick="mostrar()">Ver cafés</button>
    <div id="resultado"></div>

    <script>
        function mostrar() {
            let valor = Number(ipt_valor.value);

            let fraseFinal = "";

            for(let i = 0; i < valor; i++){
                fraseFinal += `Mostrando o café ${i + 1}, emoji de café <br>`;
            };

            resultado.innerHTML = fraseFinal;
        };

    </script>
</body>
</html>

<!-- 
Crie um pequeno simulador de preço de passagem de Bilhete Único de São Paulo num programa, o qual: 

a) Tenha uma combo para indicar o tipo de passageiro, com os itens 

            Comum 
            Estudante 
            Idoso/PNE 

b) Tenha uma outra combo, para indicar o tipo de passagem, com os itens 

            Passagem única 
            Passagem integração 

c) Ao clicar num botão "Simular preço", considere que o preço unitário de uma passagem única é R$4,40 e que a integração é R$5,90 para fazer os cálculos necessários para exibir uma frase como esta: 

            Valor da passagem escolhida: R$X,XX 

d) Considere ainda que um estudante tem 50% de desconto e idoso/PNE possuem gratuidade em qualquer tipo de passagem 
 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Preço do Bilhete Único de São Paulo</title>
</head>
<body>
    
    <div>
        <label for="select_tipo_passageiro">Insira um valor para indicar o tipo de passageiro: </label>
        <select id="select_tipo_passageiro">
            <option value="Comum">Comum</option>
            <option value="estudante">Estudante</option>
            <option value="idoso">Idoso/PNE</option>
        </select>
    </div>
    <div>
        <label for="select_tipo_passagem">Insira um valor para indicar o tipo de passagem: </label>
        <select id="select_tipo_passagem">
            <option value="passagem_unica">Passagem única</option>
            <option value="passagem_integracao">Passagem integração</option>
        </select>
    </div>

    <button onclick="simularPreco()">Simular preço</button>
    <h4 id="h4_resultado"></h4>

<script>
    function simularPreco() {
        let tipoPassageiro = select_tipo_passageiro.value;
        let tipoPassagem = select_tipo_passagem.value;

        let valorPassagem;
        
        tipoPassagem == 'passagem_unica' ? valorPassagem = 4.40 : valorPassagem = 5.90;
        
        if(tipoPassageiro == 'idoso'){
            h4_resultado.innerHTML = `Possue gratuidade em qualquer passagem`;
        } else if(tipoPassageiro == 'estudante') {
            h4_resultado.innerHTML = `Valor de passagem escolhida: R$${((valorPassagem / 2).toFixed(2))}`
        }else{
            h4_resultado.innerHTML = `Valor de passagem escolhida: R$${(valorPassagem.toFixed(2))}`
        }
    };

</script>

</body>
</html>

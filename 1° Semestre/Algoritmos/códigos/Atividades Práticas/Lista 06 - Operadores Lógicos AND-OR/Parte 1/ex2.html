<!-- 
Imagine que Robervaldo está buscando um novo celular. Ele tem algumas preferências específicas para a escolha de modelo.

Robervaldo prefere celulares com tela grande (acima de 6.5 polegadas) e que sejam da cor preta ou prata.

Com base nessas informações, crie um simulador no qual:

a) Solicite o tamanho da tela do celular encontrado.

b) Solicite a cor do celular encontrado, dentre as opções:

    Preto
    Prata
    Azul
    Vermelho

c) Ao clicar em "Será que ele gosta?", mostre, abaixo:

    A imagem de uma pessoa feliz, caso as características do celular coincidam com as preferências de Robervaldo.
    Ou a imagem de uma pessoa decepcionada, caso contrário.  
 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Preferências de Compras: Será que Robervaldo Gostaria?</title>
</head>
<body>
    
    <div>
        <label for="ipt_tamanho">Insira o tamanho da tela do celular: </label>
        <input type="number" id="ipt_tamanho" placeholder="Utilize polegadas!">
    </div>
    <div>
        <label for="ipt_cor">Insira a cor do celular (entre essas opções: 
            <br>Preto
            <br>Prata
            <br>Azul
            <br>Vermelho):
            <br>
        </label>
        <input type="text" id="ipt_cor" placeholder="Utilize as cores apresentadas!">
    </div>

    <button onclick="verificarCelular()">Será que ele gosta?</button>

    <div id="div_resultado"></div>
<script>
    function verificarCelular() {
        let tamanho = Number(ipt_tamanho.value);
        let cor = ipt_cor.value;

        // Huawei Mate XT Ultimate == 10,2 polegadas
        if (tamanho < 0 || tamanho > 10.2){
            div_resultado.innerHTML = `Tamanho inválido!`;
        } else if (cor != `Preto` && cor != `Prata` && cor != `Azul` && cor != `Vermelho`){
            div_resultado.innerHTML = `Cor inválida!`;
        } else {
            tamanho == 6.5 && (cor == `Preto` || cor == `Prata`) ? div_resultado.innerHTML = `<img src="https://static0.thegamerimages.com/wordpress/wp-content/uploads/2022/12/bullymaguire.jpg?q=50&fit=crop&w=1600&h=900&dpr=1.5" alt="Homem Aranha feliz">` : div_resultado.innerHTML = `<img src="https://wallpapers.com/images/high/spider-man-in-the-rain-81el0qfqyj7yrtc2.webp" alt="Homem Aranha triste">`
        }

    };

</script>

</body>
</html>

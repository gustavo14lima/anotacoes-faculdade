<!-- 
Crie um pequeno sistema de avaliação de atendimento, o qual: 

a) Pergunte a nota para o atendimento 

b) Ao clicar num botão "Avaliar atendimento", pode uma dessas frases abaixo do botão: 

    b.1) "Nota inválida", caso a nota não esteja entre 0 e 10 

    b.2) "Não aprovado", caso a nota for entre 0 e menor que 5 

    b.3) "Neutro", caso a nota for entre 5 e 6 

    b.4) "Aprovado", caso a nota for mais que 6 
 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaliação de Atendimento: Dê Sua Nota!</title>
</head>
<body>
    
    <div>
        <label for="ipt_nota">Insira a nota para o atendimento: </label>
        <input type="number" id="ipt_nota">
    </div>

    <button onclick="avaliarAtendimento()">Avaliar atendimento</button>

    <h4 id="h4_resultado"></h4>

<script>
    function avaliarAtendimento() {
        let nota = Number(ipt_nota.value);

        if (nota < 0 || nota > 10){
            h4_resultado.innerHTML = `Nota inválida`;
        } else if (nota < 5){
            h4_resultado.innerHTML = `Não aprovado`;
        } else if (nota <= 6){
            h4_resultado.innerHTML = `Neutro`;
        } else {
            h4_resultado.innerHTML = `Aprovado`;
        }
    };

</script>

</body>
</html>

<!-- 

Um novo banco eletrônico, o Banco Melete possui um sistema diferenciado de autenticação no qual pede um login, uma senha e uma 3ª informação pessoal, que pode ser o ano de nascimento ou o nome do animal de estimação do cliente. Crie um protótipo que simule a autenticação de um determinado cliente, o qual: 

a) Solicite o login, a senha e a informação pessoal ao usuário 

b) Ao clicar num botão "Autenticar", exiba uma dessas frases abaixo do botão: 

     b.1.) "Usuário autenticado", caso o login seja "ana", a senha "braga" e a informação pessoal for ou "1949" ou "louro josé" 

     b.2.) "Falha na autenticação", caso as regras de verificação em b.1) falhem 
 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação Segura: Acesso ao Banco Melete</title>
</head>
<body>
    
    <div>
        <label for="ipt_login">Insira o seu login: </label>
        <input type="text" id="ipt_login">
    </div>
    <div>
        <label for="ipt_senha">Insira a sua senha: </label>
        <input type="text" id="ipt_senha">
    </div>
    <div>
        <label for="ipt_informacao_pessoal">Insira a sua informação pessoal: </label>
        <input type="text" id="ipt_informacao_pessoal">
    </div>

    <button onclick="autenticar()">Autenticar</button>
    <h4 id="h4_resultado"></h4>

<script>
    function autenticar() {
        let login = ipt_login.value;
        let senha = ipt_senha.value;
        let informacaoPessoal = ipt_informacao_pessoal.value;

        if (login == 'ana' && senha == 'braga' && informacaoPessoal == 1949 || informacaoPessoal == 'louro josé'){
            h4_resultado.innerHTML = `Usuário autenticado`
        } else {
            h4_resultado.innerHTML = `Falha na autenticação`
        }
    };

</script>

</body>
</html>

<!-- 
Refaça o programa anterior de tal forma que, antes de cada frase apareça um contador. Ex: Se a frase digitada foi “Boa Tarde” a página ficará assim:   

   1. Boa tarde   

   2. Boa tarde   

   ...   

   7. Boa tarde  
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. Frase Numerada</title>
</head>
<body>
    <div>
        <label for="ipt_frase">Insira uma frase: </label>
        <input type="text" id="ipt_frase">
    </div>
    <button onclick="mostrarFrase()">Diga algo sobre a matéria de Algoritmos</button>
    <div id="div_resultado"></div>

    <script>
        function mostrarFrase() {
            let frase = ipt_frase.value;
            for (let i = 1; i <= 7; i++) {
                div_resultado.innerHTML += `${i}. ${frase} <br>`
            };
        };

    </script>
    
</body>
</html>

<!-- 
Crie um programa o qual:
 

a) Pergunte ao usuário um número;  

b) Pergunte ao usuário uma frase.  

c) Ao clicar num botão "Papagaio", a frase é exibida N vezes em N alerts, onde N é o número informado em a)    
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8. Papagaio Falante</title>
</head>
<body>
    
    <div>
        <label for="ipt_numero">Insira um número: </label>
        <input type="number" id="ipt_numero">
    </div>
    <div>
        <label for="ipt_frase">Insira uma frase: </label>
        <input type="text" id="ipt_frase">
    </div>

    <button onclick="repetirFrase()">Papagaio</button>
    <div id="div_resultado"></div>

    <script>
        function repetirFrase() {
            let numero = Number(ipt_numero.value);
            let frase = ipt_frase.value;

            if(numero < 0){
                alert('Seu número precisa ser maior que 0!')
            } else {
               for(let i = 1; i <= numero; i++){
                    alert(frase);
               }
            }

        };
    </script>

</body>
</html>

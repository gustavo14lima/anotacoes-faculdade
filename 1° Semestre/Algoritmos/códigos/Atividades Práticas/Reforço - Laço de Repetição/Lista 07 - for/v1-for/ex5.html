<!-- 
 

a) O usuário informa quantos depósitos ele fez no banco   

b) O usuário informa o valor de cada depósito, pois ele sempre depositava exatamente o mesmo valor   

c) Ao clicar em "Acompanhar grana", deve aparecer o valor, mês a mês, como neste exemplo   

    1º Mês: R$ 500.00   

    2º Mês: R$ 1000.00   

    3º Mês: R$ 1500.00   

    4º Mês: R$ 2000.00   

    5º Mês: R$ 2500.00   

    Total guardado: R$2500.00   

No exemplo acima, o usuário informou 5 depósitos e 500 por depósito. 


-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
</head>
<body>
    
    <div>
        <label for="ipt_qtd_deposito">Insira a quantidade de depósitos você fez no banco: </label>
        <input type="number" id="ipt_qtd_deposito">
    </div>

    <div>
        <label for="ipt_valor">Insira o valor de cada depósito, sempre depositando o mesmo valor: </label>
        <input type="number" id="ipt_valor">
    </div>

    <button onclick="acompanharGrana()">Acompanhar grana</button>
    <div id="div_resultado"></div>

    <script>
        function acompanharGrana() {
            let qtdDeposito = Number(ipt_qtd_deposito.value);
            let valor = Number(ipt_valor.value);
            
            let valorTotal = 0;
            div_resultado.innerHTML = "";

            for (let i = 1; i <= qtdDeposito; i++){
                valorTotal += valor;
                div_resultado.innerHTML += `${i}° Mês: R$${valorTotal.toFixed(2)} <br>`;
            }

            div_resultado.innerHTML += `Total guardado: R$${valorTotal.toFixed(2)}`

        };
        
    </script>

</body>
</html>

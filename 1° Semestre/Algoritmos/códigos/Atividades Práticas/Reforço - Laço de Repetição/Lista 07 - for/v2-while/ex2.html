<!-- 
Incremente a questão anterior de tal forma que:   

a) Também tenha um campo no qual o usuário indique a capacidade de passageiros que o veículo suporta   

b) Ao clicar no botão, as frases só começam a mostrar que o passageiro terá que esperar quando a capacidade indicada em a) for excedida.   
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
</head>
<body>
    
    <div>
        <label for="ipt_qtd_pessoas">Insira a quantidade de pessoas que vão entrar no carro:</label>
        <input type="number" id="ipt_qtd_pessoas" placeholder="Ex: 6">
    </div>
    <div>
        <label for="ipt_capacidade_passageiros">Insira a quantidade de passageiros que o veículo suporta: </label>
        <input type="number" id="ipt_capacidade_passageiros" placeholder="Ex: 7">
    </div>
    
    <button onclick="simular()">#Partiu Carona</button>
    <div id="div_resultado"></div>

    <script>
        function simular() {
            let qtdPessoas = Number(ipt_qtd_pessoas.value);
            let capacidadePassageiros = Number(ipt_capacidade_passageiros.value);
            let contador = 1;

            while(contador <= qtdPessoas){
                if (contador <= capacidadePassageiros){
                    contador == 1 ? div_resultado.innerHTML = `Entrou o ${contador}º passageiro (que é o(a) motorista) <br>` : div_resultado.innerHTML += `Entrou o ${contador}º passageiro <br>`
                } else {
                    div_resultado.innerHTML += `O ${contador}º passageiro terá que esperar <br>`;
                }
                contador ++;
            }
        };

    </script>    

</body>
</html>

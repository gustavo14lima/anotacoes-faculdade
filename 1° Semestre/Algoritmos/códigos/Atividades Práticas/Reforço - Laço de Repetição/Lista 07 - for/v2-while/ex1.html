<!-- 
Crie um programa que simule a entrada de caronas num carro:   

a) Pergunte ao usuário quantas pessoas, vão entrar no carro   

b) Ao clicar num botão "#Partiu Carona"...   

c) Exiba, debaixo do botão, frases como estas:   

Entrou o 1º passageiro (que é o(a) motorista)   

Entrou o 2º passageiro   

Entrou o 3º passageiro   

Entrou o 4º passageiro   

Entrou o 5º passageiro   

O 6º passageiro terá que esperar!   

O 7º passageiro terá que esperar!   

d) Note que, sempre na frase do 1º passageiro, deve constar ao lado que é motorista   

e) A partir do 6º passageiro, a frase muda, pois o carro só comporta 5 passageiros    
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    
    <div>
        <label for="ipt_qtd_pessoas">Insira a quantidade de pessoas que vão entrar no carro:</label>
        <input type="number" id="ipt_qtd_pessoas" placeholder="Ex: 7">
    </div>
    
    <button onclick="simular()">#Partiu Carona</button>
    <div id="div_resultado"></div>

    <script>
        function simular() {
            let qtdPessoas = Number(ipt_qtd_pessoas.value);
            let contador = 1;

            while (contador <= qtdPessoas){
                if (contador < 6){
                    contador == 1 ? div_resultado.innerHTML = `Entrou o ${contador}º passageiro (que é o(a) motorista) <br>` : div_resultado.innerHTML += `Entrou o ${contador}º passageiro <br>`
                } else {
                    div_resultado.innerHTML += `O ${contador}º passageiro terá que esperar! <br>`
                }
                contador ++;
            };
        };

    </script>

</body>
</html>

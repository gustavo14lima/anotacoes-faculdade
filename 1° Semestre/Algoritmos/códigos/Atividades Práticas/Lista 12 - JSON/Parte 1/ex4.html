<!-- 

4. Atualizando Propriedades

Crie um objeto JSON chamado conta com: titular, saldo e banco. Crie dois botões na tela — Depositar e Sacar — que leem um valor de um <input> e atualizam o saldo do objeto. Exiba o saldo atualizado após cada operação. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4 - Atualizando Propriedades</title>
</head>
<body>
    
    <label for="ipt_valor">Insira um valor para depositar ou sacar: </label>
    <input type="number" id="ipt_valor" placeholder="Ex: 50">

    <button onclick="depositar()">Depositar</button>
    <button onclick="sacar()">Sacar</button>
    <div id="resultado"></div>

    <script>
        let conta = {
            titular: "Oliver Aiku",
            saldo: 0,
            banco: "Banco do Brasil"
        };

        function depositar(){
            let valor = Number(ipt_valor.value);

            conta.saldo += valor;

            resultado.innerHTML = `
            O seu saldo atualizado é: R$ ${conta.saldo}
            `;
        };

        function sacar() {
            let valor = Number(ipt_valor.value);

            conta.saldo -= valor;

            resultado.innerHTML = `
            O seu saldo atualizado é: R$ ${conta.saldo}
            `;
        }

    </script>

</body>
</html>

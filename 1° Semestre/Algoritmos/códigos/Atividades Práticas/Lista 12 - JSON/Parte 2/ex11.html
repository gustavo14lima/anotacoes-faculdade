<!-- 
11. Consulta de Notas por RA

Crie um objeto JSON onde a chave é o RA do aluno e o valor é outro objeto com nome e nota:

const turma = {
   "1001": { nome: "Carlos",  nota: 8.5 },
   "1002": { nome: "Beatriz", nota: 9.0 },
   ...
 };

Crie um <input> para o RA e um botão Consultar que exibe o nome e a nota do aluno. Se o RA não existir, exiba "Aluno não encontrado". 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 11 - Consulta de Notas por RA</title>
</head>
<body>
    
    <h1>Consulta de Notas por RA</h1>
    <label for="ipt_consulta">Insira um RA para realizar a consulta: </label>
    <input type="text" id="ipt_consulta" placeholder="Ex: 1003">

    <button onclick="consultarAluno()">Consultar Aluno</button>
    <div id="resultado"></div>

    <script>
        const turma = {
            "1001": { 
                nome: "Carlos",  
                nota: 8.5 
            },
            "1002": { 
                nome: "Beatriz", 
                nota: 9.0 
            },
            "1003": {
                nome: "Carlos Eduardo",
                nota: 6
            },
            "1004": {
                nome: "Enzo Martins",
                nota: 7
            },
            "1005": {
                nome: "Gustavo Lima",
                nota: 10
            },
            "1006": {
                nome: "Luiz Phelipe",
                nota: 2.35
            },
            "1007": {
                nome: "Thiago Emidio",
                nota: 6.7
            }
        };

        function consultarAluno() {
            let consultaRA = ipt_consulta.value;

            if(turma[consultaRA] != undefined){
                resultado.innerHTML = `Aluno encontrado: <br> Nome: ${turma[consultaRA].nome} | Nota: ${turma[consultaRA].nota}`
            } else{
                resultado.innerHTML = "Aluno não encontrado"
            }
        };

    </script>
</body>
</html>

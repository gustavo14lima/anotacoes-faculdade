<!-- 
10. Tabela de Descontos por Categoria

Crie um objeto JSON mapeando categorias de clientes a percentuais de desconto:

const descontos = {
   "estudante": 0.20,
   "idoso":     0.15,
   "professor": 0.10,
   "comum":     0.00
 };

Crie um formulário com <input> para o valor da compra e um <select> para a categoria do cliente. Ao clicar em Calcular, exiba o desconto aplicado e o valor final.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10 - Tabela de Descontos por Categoria</title>
</head>
<body>
    
    <h1>Tabela de Descontos por Categoria</h1>
    <label for="ipt_valor">Insira um valor de compra: </label>
    <input type="number" id="ipt_valor" placeholder="Ex: 120">

    <select id="ipt_opcoes">
        <option value="estudante">estudante</option>
        <option value="idoso">idoso</option>
        <option value="professor">professor</option>
        <option value="comum">comum</option>
    </select>

    <button onclick="calcularDesconto()">Calcular</button>
    <div id="resultado"></div>

    <script>
        const descontos = {
            "estudante": 0.20,
            "idoso":     0.15,
            "professor": 0.10,
            "comum":     0.00
        };

        function calcularDesconto(){
            let valor = Number(ipt_valor.value);
            let opcoes = ipt_opcoes.value;

            resultado.innerHTML = `Você escolher a opção de ${opcoes}, ganhando R$ ${descontos[opcoes].toFixed(2)} de desconto. O valor final a ser pago é: R$ ${opcoes == 'comum' ? valor : (valor - (valor * descontos[opcoes])).toFixed(2)}`
        };

    </script>

</body>
</html>

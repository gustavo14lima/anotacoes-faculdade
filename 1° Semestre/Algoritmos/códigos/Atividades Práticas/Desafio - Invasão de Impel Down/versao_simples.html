<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio - Invasão de Impel Down</title>
</head>
<body>
    
    <div>
        <label for="ipt_qtd_batalhas">Insira a quantidade de batalhas: </label>
        <input type="number" id="ipt_qtd_batalhas">
    </div>
    <div>
        <label for="ipt_qtd_marinheiros">Insira a quantidade de marinheiros em cada batalha: </label>
        <input type="number" id="ipt_qtd_marinheiros">
    </div>
    <div>
        <label for="ipt_qtd_carnes">Insira a quantidade de carnes disponíveis: </label>
        <input type="number" id="ipt_qtd_carnes">
    </div>

    <button onclick="mostrarBatalha()">Batalhar</button> <br>
    <div id="resultado"></div>

    <script>

        function mostrarBatalha() {
            resultado.innerHTML = ``;

            let luffyEnergia = 100;

            let qtdBatalhas = Number(ipt_qtd_batalhas.value);
            let qtdMarinheiros = Number(ipt_qtd_marinheiros.value);
            let qtdCarnes = Number(ipt_qtd_carnes.value);

            resultado.innerHTML += `
            ---------------------------------------- <br>
            Quantidade de batalhas: ${qtdBatalhas} <br>
            Quantidade de marinheiros: ${qtdMarinheiros} <br>
            Quantidade de carnes: ${qtdCarnes} <br>
            ----------------------------------------
            <br>
            `

            for (let i = 1; i <= qtdBatalhas; i++){
                if (luffyEnergia > 0){
                    i > 1 ? luffyEnergia -= 10 : luffyEnergia
                    
                    resultado.innerHTML += `
                    ${i}° Batalha Iniciada: <br>
                    Quantidade de Energia Inicial: ${luffyEnergia} <br>
                    `

                    let danoTotal = 5 * qtdMarinheiros;
                    let energiaNecessaria;

                    if (danoTotal > luffyEnergia){
                        energiaNecessaria = danoTotal - luffyEnergia;

                        if (energiaNecessaria < 100 && qtdCarnes > 0){
                            qtdCarnes -= 1
                            luffyEnergia = 100 - energiaNecessaria

                            resultado.innerHTML += `
                            Resultado: Luffy saiu vitorioso, derrotando ${qtdMarinheiros} marinheiro(s) <br>
                            <br>                        
                            ⚡ Energia Restante no Final da Batalha: ${luffyEnergia} <br>
                            🥩 Carnes Restantes no Final da Batalha: ${qtdCarnes} <br>
                            `
                        } else {
                            luffyEnergia = 0;

                            resultado.innerHTML += `
                            Resultado: Luffy foi derrotado, derrotando ${qtdMarinheiros - (energiaNecessaria / 5)} marinheiro(s)<br> 
                            <br>
                            ⚡ Energia Restante no Final da Batalha: ${luffyEnergia} <br>
                            🥩 Carnes Restantes no Final da Batalha: ${qtdCarnes} <br>
                            `
                        }
                    } else {
                        resultado.innerHTML += `
                        ⚡ Energia Restante no Final da Batalha: ${luffyEnergia} <br>
                        🥩 Carnes Restantes no Final da Batalha: ${qtdCarnes} <br>
                        `
                    }
                } else {
                    resultado.innerHTML += `
                    🛞 Não é possível iniciar a ${i}º batalha, acabou a carne e a energia. <br>
                    `
                }
                resultado.innerHTML += `
                <br>
                ----------------------------------------
                <br>
                <br>
                `
            };
        };

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio - Invasão de Impel Down</title>
</head>
<body>
    
    <div>
        <label for="ipt_qtd_batalhas">Insira a quantidade de batalhas: </label>
        <input type="number" id="ipt_qtd_batalhas">
    </div>
    <div>
        <label for="ipt_qtd_marinheiros">Insira a quantidade de marinheiros em cada batalha: </label>
        <input type="number" id="ipt_qtd_marinheiros">
    </div>
    <div>
        <label for="ipt_qtd_carnes">Insira a quantidade de carnes disponíveis: </label>
        <input type="number" id="ipt_qtd_carnes">
    </div>

    <button onclick="mostrarBatalha()">Batalhar</button> <br>
    <div id="resultado"></div>

    <script>
        
        function mostrarBatalha() {
            resultado.innerHTML = ``;

            let luffyEnergia = 100;

            let qtdBatalhas = Number(ipt_qtd_batalhas.value);
            let qtdMarinheiros = Number(ipt_qtd_marinheiros.value);
            let qtdCarnes = Number(ipt_qtd_carnes.value);

            let contadorMarinheirosDerrotados = 0;

            resultado.innerHTML += `
            ---------------------------------------- <br>
            Quantidade de batalhas: ${qtdBatalhas} <br>
            Quantidade de marinheiros: ${qtdMarinheiros} <br>
            Quantidade de carnes: ${qtdCarnes} <br>
            ----------------------------------------
            <br>
            `

            for (let i = 1; i <= qtdBatalhas; i++){
                contadorMarinheirosDerrotados = 0;

                if (luffyEnergia > 0){
                    i > 1 ? luffyEnergia -= 10 : luffyEnergia

                    resultado.innerHTML += `                
                    ${i}° Batalha Iniciada: <br>
                    Quantidade de Energia: ${luffyEnergia} <br>
                    ` 


                    for(let j = 1; j <= qtdMarinheiros; j++){
                        if (luffyEnergia > 0){
                            resultado.innerHTML += `
                            🗡️ Derrotando ${j}° marinheiro 
                            <br>
                            `
                            luffyEnergia -= 5;
                            contadorMarinheirosDerrotados += 1;
                        }else if (luffyEnergia == 0 && qtdCarnes > 0){
                            qtdCarnes -= 1;
                            luffyEnergia = 100;

                            resultado.innerHTML += `
                            🥩 Energia recarregada com carne
                            <br>
                            `

                            resultado.innerHTML += `
                            🗡️ Derrotando ${j}° marinheiro 
                            <br>
                            `
                            luffyEnergia -= 5;
                            contadorMarinheirosDerrotados += 1;
                        } else if(luffyEnergia == 0 && qtdCarnes == 0){
                            resultado.innerHTML += `
                            🕱 Energia esgotada, não há mais carne disponível, o ${j}° marinheiro continua vivo
                            <br>
                            `
                        }
                    };

                    if (luffyEnergia > 0) {
                        resultado.innerHTML += `
                        Resultado: Luffy saiu vitorioso, derrotando ${contadorMarinheirosDerrotados} marinheiro(s) <br>
                        ⚡ Energia Restante no Final da Batalha: ${luffyEnergia} <br>
                        🥩 Carnes Restantes no Final da Batalha: ${qtdCarnes} <br>
                        <br>
                        `;
                    } else {
                        resultado.innerHTML += `
                        Resultado: Luffy derrotado, derrotando ${contadorMarinheirosDerrotados} marinheiro(s) <br>
                        ⚡ Energia Restante no Final da Batalha: ${luffyEnergia} <br>
                        🥩 Carnes Restantes no Final da Batalha: ${qtdCarnes} <br>
                        <br>
                        `;
                    }
                } else {
                    resultado.innerHTML += `
                    🛞 Não é possível iniciar a ${i}º batalha, acabou a carne e a energia.
                    <br>
                    `
                }

                resultado.innerHTML += `
                ----------------------------------------
                <br>
                `
            };

        };

    </script>

</body>
</html>

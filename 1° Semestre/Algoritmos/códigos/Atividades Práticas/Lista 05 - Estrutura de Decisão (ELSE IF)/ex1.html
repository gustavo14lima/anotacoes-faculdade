<!-- 

1. Altura e Esportes: Descubra Sua Vantagem Competitiva

Crie um programa no qual um profissional de educação física possa determinar de forma mais rápida quais esportes uma pessoa tem uma boa altura para praticar. 

a) Solicite a altura do usuário;

b) Ao clicar em "Analisar Estatura", deve aparecer abaixo uma dessas frases: 

   "Você pode ser piloto de corrida" (altura até 1.65) 

   "Você pode ser jogador de futebol" (altura +1.65 até 1.80) 

   "Você pode ser jogador de vôlei ou basquete" (altura + 1.80) 

 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altura e Esportes: Descubra Sua Vantagem Competitiva</title>
</head>
<body>
    
    <div>
        <label for="id_altura">Insira a sua altura: </label>
        <input type="number" id="id_altura" placeholder="Insira sua altura em centimetros">
    </div>

    <button onclick="analisarEstatura()">Analisar Estatura</button>
    <h4 id="id_resultado"></h4>

</body>

<script>
    function analisarEstatura() {
        let altura = Number(id_altura.value);

        if(altura <= 165) {
            id_resultado.innerHTML = `Você pode ser piloto de corrida`;
        } else if (altura <= 180) {
            id_resultado.innerHTML = `Você pode ser jogador de futebol`;
        } else {
            id_resultado.innerHTML = `Você pode ser jogador de vôlei ou basquete`;
        }
    };

</script>

</html>

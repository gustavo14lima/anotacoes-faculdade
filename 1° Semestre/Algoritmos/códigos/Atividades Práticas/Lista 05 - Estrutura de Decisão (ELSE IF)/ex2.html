<!-- 

2. Classe Social em Tuvalu: Em Qual Você se Encaixa?

Crie um programa que exibe a classe social de uma pessoa que mora em Tuvalu (um dos menores países do mundo) conforme a renda familiar mensal. 

a) Solicite a renda familiar mensal 

b) Ao clicar no botão “Analisar Renda”, deve aparecer abaixo uma dessas frases:   

   "Classe E" (até 250) 

   "Classe D" (+250 até 900) 

   "Classe C" (+900 até 2500) 

   "Classe B" (+2500 até 9500) 

   "Classe A" (+9500) 
 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classe Social em Tuvalu: Em Qual Você se Encaixa?</title>
</head>
<body>
    
    <div>
        <label for="id_renda_familiar">Insira a sua renad familiar mensal:</label>
        <input type="number" id="id_renda_familiar">
    </div>

    <button onclick="analisarRenda()">Analisar Renda</button>
    <h4 id="id_resultado"></h4>

</body>

<script>
    function analisarRenda() {
        let rendaFamiliar = Number(id_renda_familiar.value);

        if (rendaFamiliar <= 250){
            id_resultado.innerHTML = `Classe E`;
        } else if (rendaFamiliar <= 900){
            id_resultado.innerHTML = `Classe D`;
        } else if (rendaFamiliar <= 2500){
            id_resultado.innerHTML = `Classe C`;
        } else if (rendaFamiliar <= 9500) {
            id_resultado.innerHTML = `Classe B`;
        } else {
            id_resultado.innerHTML = `Classe A`;
        }
    };

</script>

</html>

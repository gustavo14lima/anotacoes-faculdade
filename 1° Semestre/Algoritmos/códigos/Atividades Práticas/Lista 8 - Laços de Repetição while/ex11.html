<!-- 
Crie um programa o qual:
 

a) Pergunte, numa input ou lista suspensa (select/option), qual a tabuada que o usuário quer ver na tela (2 a 9);  

b) Pergunte até que número a tabuada deve ser construída;  

c) Ao clicar no botão “Ver Tabuada”, exiba abaixo a tabuada como neste exemplo (considerando que o usuário escolheu a tabuada do 3 e para ir até o 12).  

    3 x 1 = 3   

    3 x 2 = 6   

    3 x 3 = 9   

    3 x 4 = 12   

    3 x 5 = 15   

    3 x 6 = 18   

    3 x 7 = 21   

    3 x 8 = 24   

    3 x 9 = 27   

    3 x 10 = 30   

    3 x 11 = 33   

    3 x 12 = 36   

d) Observar que quando o multiplicador for ímpar, a linha apareça na cor vermelha e quando for par, na cor azul. ex: "3 x 1 = 3" aparecer tudo em vermelho, mas "3 x 4 = 12" aparece tudo em azul.   
 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11. Tabuada Colorida</title>
</head>
<body>
    
    <div>
        <label for="ipt_tabuada">Insira a tabuada que gostaria de ver (precisa ser entre 2 e 9): </label>
        <input type="number" id="ipt_tabuada">
    </div>
    <div>
        <label for="ipt_numero_max">Insira um número para especificar até qual número a tabuada deve ser construida: </label>
        <input type="number" id="ipt_numero_max">
    </div>

    <button onclick="visualizarTabuada()">Ver Tabuada</button>
    <div id="div_resultado"></div>

    <script>
        function visualizarTabuada(){
            div_resultado.innerHTML = ``

            let tabuada = Number(ipt_tabuada.value);
            let numeroMax = Number(ipt_numero_max.value);
            let contador = 1;

            if (tabuada < 0 || numeroMax < 0){
                alert('Os números informados precisam ser maior que 0!')
            } else {
                if(tabuada < 2 || tabuada > 9){
                    alert('Seu número está fora do escopo')
                } else {
                    while(contador <= numeroMax){
                        if(contador % 2 != 0){
                            div_resultado.innerHTML += `<div style="color: red;">${tabuada} X ${contador} = ${tabuada * contador}</div>`
                        } else {
                            div_resultado.innerHTML += `<div style="color: blue;">${tabuada} X ${contador} = ${tabuada * contador}</div>`
                        }
    
                        contador ++;
                    }
                }
            }
        };
    </script>
    
</body>
</html>

<!-- 
Crie um programa o qual:
 

a) Receba do usuário um número (tem que ser entre 20 e 100)   

b) Ao clicar num botão "Adoro múltiplos de 5"...   

c) Exiba, debaixo do botão, todos os múltiplos de 5 entre 0 e o número informado em a), um embaixo do outro. Ex: 5, 10, 15, 20...    
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6. Múltiplos de 5</title>
</head>
<body>
    
    <div>
        <label for="ipt_numero">Insira um número de sua escolha (precisa estar entre 20 e 100): </label>
        <input type="number" id="ipt_numero">
    </div>

    <button onclick="multiplicarCinco()">Adoro múltiplicos de 5</button>
    <div id="div_resultado"></div>

    <script>
        function multiplicarCinco() {
            let numero = Number(ipt_numero.value);
            let contador = 0;

            if(numero < 20 || numero > 100){
                    alert('Você estourou o escopo! Coloque outro número!')
            } else{
                    while(contador <= numero){
                        contador % 5 == 0 ? div_resultado.innerHTML += `Dividor de 5: ${contador} <br>` : div_resultado.innerHTML += `` 
                        contador++;
                    };
                }
        };

    </script>

</body>
</html>

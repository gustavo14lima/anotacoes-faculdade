<!-- 
Crie um programa o qual:
 

a) Ao clicar num botão "S2 Pares"...  

b) Exiba, debaixo do botão, todos os números pares de 0 a 100, um embaixo do outro    
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4. S2 Pares</title>
</head>
<body>
    
    <button onclick="mostrarPares()">S2 Pares</button>
    <div id="div_resultado"></div>

    <script>
        function mostrarPares() {
            let contador = 0;

            while(contador <= 100){
                if(contador % 2 == 0){
                    div_resultado.innerHTML += `Número par: ${contador} <br>`
                }
                contador ++;
            };
        };

    </script>

</body>
</html>

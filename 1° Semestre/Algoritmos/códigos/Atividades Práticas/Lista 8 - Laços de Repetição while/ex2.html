<!-- 
Crie um programa o qual: 
 

a) Tenha um botão "Diga algo sobre a matéria de Algoritmos";  

b) Ao clicar nele, mostre na própria página 7 vezes uma frase a sua escolha, uma abaixo da outra.   
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Frase Repetitiva</title>
</head>
<body>
    
    <button onclick="mostrarFrase()">Diga algo sobre a matéria de Algoritmos</button>
    <div id="div_resultado"></div>

    <script>
        function mostrarFrase() {
            let contador = 1;

            while(contador <= 7){
                div_resultado.innerHTML += `Sejam superiores ou inferiores, os irmãos mais velhos são modelos para seus irmãos mais novos. Se o irmão mais velho toma o caminho errado, os irmãos mais novos podem evitá-lo. E se eu tomar o caminho certo, meus irmãos mais novos podem seguir atrás <br>`

                contador ++;
            };
        };

    </script>
    
</body>
</html>

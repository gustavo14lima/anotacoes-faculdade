<!-- 

a) Ao clicar no botão "Sortear temperatura", sorteia valores reais entre -20 e +20 (intervalo fechado) e exibe uma frase como esta: "Temperatura sorteada: X"  

b) Exiba uma dessas mensagens abaixo da temperatura sorteada:  

    "Dá pra conservar qualquer alimento", se a temperatura for menor que 1  

    "Conserva a maioria dos alimentos", se a temperatura for entre 1 e 10  

    "Estraga a maioria dos alimentos", se a temperatura for maior que 10 

OBS: Exiba as temperaturas como números inteiros, sem casas decimais 

-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercício 13</title>
</head>
<body>

    <button onclick="sortearTemperatura()">Sortear temperatura</button>
    <div id="resultado"></div>

    <script>
        function sortearTemperatura() {
            let temperatura = parseInt((Math.random() * (20 - (-20)) + (-20)));

            resultado.innerHTML = `Temperatura sorteada ${temperatura} <br>`;

            if(temperatura < 1){
                resultado.innerHTML += `Dá pra conservar qualquer alimento`;
            } else if (temperatura <= 10){
                resultado.innerHTML += `Conserva a maioria dos alimentos`;
            } else {
                resultado.innerHTML += `Estraga a maioria dos alimentos`;
            }

        };

    </script>

</body>
</html>

<!-- 
a) Tenha um botão "Dado Jogador 1" que faz aparecer, abaixo dele, o valor de um dadinho de 6 lados sorteado  

b) Tenha um botão "Dado Jogador 2" que faz aparecer, abaixo dele, o valor de um dadinho de 6 lados sorteado  

c) Tenha um botão "Comparar Resultados", que exibe uma das frases abaixo de tudo:  

  "Jogador [1 ou 2] venceu", caso um deles tenha vencido  

  "Empate!", em caso dos dados serem iguais  
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 10</title>
</head>
<body>
    
    <button onclick="dadoJogador1()">Dado Jogador 1</button>
    <div id="dado_jogador_1"></div>

    <button onclick="dadoJogador2()">Dado Jogador 2</button>
    <div id="dado_jogador_2"></div>

    <button onclick="compararResultados()">Comparar Resultados</button>
    <div id="resultado"></div>

    <script>
        let jogador1 = 0;
        let jogador2 = 0;

        function dadoJogador1() {
            jogador1 = parseInt(Math.random() * (6 - 0) + 0);
            dado_jogador_1.innerHTML = `Dado do jogador 1: ${jogador1}`
        };

        function dadoJogador2() {
            jogador2 = parseInt(Math.random() * (6 - 0) + 0);
            dado_jogador_2.innerHTML = `Dado do jogador 2: ${jogador2}`
        };

        function compararResultados() {
            if(jogador1 > jogador2){
                resultado.innerHTML = `Jogador 1 venceu`
            } else if(jogador1 < jogador2){
                resultado.innerHTML = `Jogador 2 venceu`
            } else {
                resultado.innerHTML = `Empate!`
            }
        };

    </script>

</body>
</html>

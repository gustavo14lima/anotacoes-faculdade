<!-- 
a) Solicite ao usuário que digite seu nome e seu número inteiro da sorte. Esse número deve ser entre 1 e 10. 

b) Ao clicar no botão "Sortear", valide se o usuário digitou entre 1 e 10. Caso não, exiba um alert orientando sobre o erro. Caso contrário, faça um sorteio de números inteiros entre 1 e 10.   

c) Caso o número sorteado em b) seja o número da sorte informado em a), exiba um texto em qualquer lugar da página dizendo "Parabéns, YYYYYYY você foi sorteado(a) após X sorteios!", onde X é a quantidade de sorteios realizados e YYYYYYY é o nome do usuário  
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 16</title>
</head>
<body>
    
    <div>
        <label for="ipt_nome">Insira o seu nome: </label>
        <input type="text" id="ipt_nome">   
    </div>

    <div>
        <label for="ipt_numero">Insira o seu número inteiro da sorte: </label>
        <input type="number" id="ipt_numero">
    </div>

    <button onclick="sortearNumero()">Sortear</button>
    <div id="resultado"></div>

    <script>
        let contador = 0;

        function sortearNumero() {
            contador ++;
            let nome = ipt_nome.value;
            let numero = Number(ipt_numero.value);

            if(numero >= 1 && numero <= 10){
                let numeroAleatorio = parseInt(Math.random() * (10 - 1) + 1);

                numero == numeroAleatorio ? resultado.innerHTML = `Parabéns, ${nome} você foi sorteado(a) após ${contador} sorteios!` : resultado.innerHTML = `Não foi dessa vez... continue tentando!`
            } else {
                alert('O número informado é contra a nossa validação! Insira outro número');
            }
        };

    </script>

</body>
</html>

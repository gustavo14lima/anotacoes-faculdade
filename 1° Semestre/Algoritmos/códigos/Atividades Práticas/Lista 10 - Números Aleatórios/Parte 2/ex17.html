<!-- 
Permita que o usuário escolha até 3 números da sorte entre 1 e 100. Sendo que as mensagens ficarão: “Parabéns, YYYYYY o seu número da sorte 99 foi sorteado após X sorteios!”.  
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 17</title>
</head>
<body>
    
    <div>
        <label for="ipt_nome">Insira o seu nome: </label>
        <input type="text" id="ipt_nome">   
    </div>

    <div>
        <label for="ipt_primeiro_numero">Insira o seu primeiro número inteiro da sorte: </label>
        <input type="number" id="ipt_primeiro_numero">
    </div>
    
    <div>
        <label for="ipt_segundo_numero">Insira o seu segundo número inteiro da sorte: </label>
        <input type="number" id="ipt_segundo_numero">
    </div>

    <div>
        <label for="ipt_terceiro_numero">Insira o seu terceiro número inteiro da sorte: </label>
        <input type="number" id="ipt_terceiro_numero">
    </div>

    <button onclick="sortearNumero()">Sortear</button>
    <div id="resultado"></div>

    <script>
        let contador = 0;

        function sortearNumero() {
            contador ++;
            let nome = ipt_nome.value;
            let primeiroNumero = Number(ipt_primeiro_numero.value);
            let segundoNumero = Number(ipt_segundo_numero.value);
            let terceiroNumero = Number(ipt_terceiro_numero.value);

            if(primeiroNumero >= 1 && primeiroNumero <= 100 || segundoNumero >= 1 && segundoNumero <= 100 || terceiroNumero >= 1 && terceiroNumero <= 100 ){
                let primeiroNumeroAleatorio = parseInt(Math.random() * (100 - 1) + 1);
                let segundoNumeroAleatorio = parseInt(Math.random() * (100 - 1) + 1);
                let terceiroNumeroAleatorio = parseInt(Math.random() * (100 - 1) + 1);

                primeiroNumero == primeiroNumeroAleatorio ? resultado.innerHTML = `Parabéns, ${nome} o seu primeiro número da sorte ${primeiroNumero} foi sorteado após após ${contador} sorteios!` : resultado.innerHTML = `Não foi dessa vez... continue tentando!`

                segundoNumero == segundoNumeroAleatorio ? resultado.innerHTML = `Parabéns, ${nome} o seu segundo número da sorte ${segundoNumero} foi sorteado após após ${contador} sorteios!` : resultado.innerHTML = `Não foi dessa vez... continue tentando!`

                terceiroNumero == terceiroNumeroAleatorio ? resultado.innerHTML = `Parabéns, ${nome} o seu terceiro número da sorte ${terceiroNumero} foi sorteado após após ${contador} sorteios!` : resultado.innerHTML = `Não foi dessa vez... continue tentando!`
            } else {
                alert('O número informado é contra a nossa validação! Insira outro número');
            }
        };

    </script>

</body>
</html>

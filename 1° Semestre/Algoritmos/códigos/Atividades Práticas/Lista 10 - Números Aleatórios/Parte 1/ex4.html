<!-- 
a) Ao clicar no botão "Sortear Nota para aluno", apareça na página um número aleatório, entre 0 e 10 (podem ser sorteados números decimais com uma casa decimal, como "8.5", por exemplo).  
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    
    <button onclick="sortearNota()">Sortear Nota para aluno</button>
    <div id="resultado"></div>

    <script>
        function sortearNota() {
            resultado.innerHTML = `A nota do aluno foi: ${(Math.random() * 10).toFixed(2)}`
        };

    </script>

</body>
</html>

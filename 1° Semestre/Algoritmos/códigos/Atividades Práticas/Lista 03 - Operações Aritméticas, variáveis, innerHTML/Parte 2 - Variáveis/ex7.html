<!-- 
7. Simulador de Transações Bancárias

Crie um programa que:  

a) Tenha os botões “Receber 100” e “Pagar 50”.  

b) Ao clicar em “Receber 100”, atualize o saldo do usuário e exiba a mensagem “Transferência de R$100 recebida! Saldo atual: R$Y”. 

c) Ao clicar em “Pagar 50”, atualize o saldo do usuário e exiba a mensagem “Pagamento de R$50 efetuado! Saldo atual: R$Y”. 

OBS: o valor do saldo se inicia em 0, para depois ir reduzindo/incrementando de acordo com a operação realizada  
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Transações Bancárias</title>
</head>
<body>
    <div class="informacoes">
        <h1 id="idMensagem"></h1>
    </div>
    <div>
        <button onclick="receber()">Receber 100</button>
    </div>
    <div>
        <button onclick="pagar()">Pagar 50</button>
    </div>

</body>

<script>
    let saldoUsuario = 0;

    function receber() {
        saldoUsuario += 100;
        idMensagem.innerHTML = `Transferência de R$100 recebida! <br> Saldo atual: R$${saldoUsuario}`;
    };

    function pagar() {
        saldoUsuario -= 50;
        idMensagem.innerHTML = `Pagamento de R$50 efetuado! Saldo atual: R$${saldoUsuario}`;
    };

</script>

</html>

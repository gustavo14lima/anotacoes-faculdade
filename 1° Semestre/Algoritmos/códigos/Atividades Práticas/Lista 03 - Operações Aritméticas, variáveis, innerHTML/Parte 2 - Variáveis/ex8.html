<!-- 
8. Banco Virtual: Depósitos e Retiradas

Crie um programa que:  

a) Solicite o valor a ser depositado/retirado pelo usuário 

b) Tenha os botões “Depositar” e “Retirar”. Ao clicar em algum deles, exibe um alerta com uma das mensagens abaixo, de acordo com o botão que foi clicado:  

   - Depósito de R$X efetuado! Saldo atual: R$Y 

   - Retirada de R$X efetuada! Saldo atual: R$Y 

OBS: o valor do saldo atual se inicia em 0, para depois ir reduzindo/incrementando de acordo com a operação realizada  
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Virtual: Depósitos e Retiradas</title>
</head>
<body>
    
    <div>
        <label for="idValor">Insira o valor a ser depositado ou retirado: </label>
        <input type="number" id="idValor">
    </div>

    <button onclick="depositar()">Depositar</button>
    <button onclick="retirada()">Retirar</button>

</body>

<script>
    let saldoUsuario = 0;
    let valor = Number(idValor.value);

    function depositar() {
        alert(`Depósito de R$${valor} efetuado! Saldo atual: R$${saldoUsuario += valor}`);
    };

    function retirada() {
        alert(`Retirada de R$${valor} efetuada! Saldo atual: R$${saldoUsuario -= valor}`);
    };

</script>

</html>

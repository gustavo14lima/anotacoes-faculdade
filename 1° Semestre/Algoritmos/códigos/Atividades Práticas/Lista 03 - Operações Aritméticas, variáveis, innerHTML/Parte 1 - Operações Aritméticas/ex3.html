<!-- 
3. Economia com Bilhete Único 

Um estudante recebeu o Bilhete Único de estudante pela primeira vez e deseja saber quanto vai economizar por mês. O valor para estudante é metade do valor da passagem. Crie um programa que:

    Solicite o valor da passagem e o número de viagens mensais.

    Ao clicar no botão "Ver economia", exiba um alerta informando:

        "Você economizará R$X por mês", onde X é o valor economizado.
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economia com Bilhete Único</title>
</head>
<body>
    
    <div class="valorPassagem">
        <label for="idValorPassagem">Insira o valor da passagem: </label>
        <input type="number" id="idValorPassagem">
    </div>
    <div class="numeroViagensMensais">
        <label for="idNumeroViagensMensais">Insira a quantidade de viagens mensais: </label>
        <input type="number" id="idNumeroViagensMensais">
    </div>
    <button onclick="economiar()">Ver economia</button>

</body>

<script>
    function economiar() {
        let valorPassagem = Number(idValorPassagem.value);
        let numeroViagensMensais = Number(idNumeroViagensMensais.value);
        let passagemEstudante = valorPassagem / 2

        let valorEconomizado = (valorPassagem * numeroViagensMensais) - (passagemEstudante * numeroViagensMensais)
        alert(`Você economizará R$${valorEconomizado} por mês`);
    };
    
</script>

</html>

<!-- 
9. Calculadora das Fases do Sono

Crie um programa que ajude a calcular o tempo de cada fase do sono do ser humano.  

 Sabendo que nosso sono possui fases como descreve a figura abaixo:  

Vamos considerar que as fases do sono possuem a porcentagens de tempo descritas na figura.  

a) Solicite ao usuário quantas horas de sono ele dormiu  

b) Ao clicar no botão "Calcular Sono", faça os cálculos necessários para exibir o seguinte conteúdo na tela:  

    Ao dormir X horas, você dormiu:  

    A horas na fase 1  

    B horas na fase 2  

    C horas na fase 3  

    D horas na fase REM   
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora das Fases do Sono</title>
</head>
<body>
    
    <div>
        <label for="idHorasDormidas">Insira a qanidade de horas de sono dormindas: </label>
        <input type="number" id="idHorasDormidas">
    </div>

    <button onclick="calcularSono()">Calcular Sono</button>

    <p id="idCalculoSono"></p>

</body>

<script>
    function calcularSono() {
        let horasDormidas = Number(idHorasDormidas.value);
        
        let fase1 = horasDormidas * 0.05;
        let fase2 = horasDormidas * 0.45;
        let fase3 = horasDormidas * 0.30;
        let faseREM = horasDormidas * 0.20;

        let quebraDeLinha = "<br>";

        idCalculoSono.innerHTML = `
        Ao dormir ${horasDormidas} horas, você dormiu:  
            ${quebraDeLinha}
            ${fase1} horas na fase 1   
            ${quebraDeLinha}
            ${fase2} horas na fase 2  
            ${quebraDeLinha}
            ${fase3} horas na fase 3  
            ${quebraDeLinha}
            ${faseREM} horas na fase REM`;
    };

</script>

</html>

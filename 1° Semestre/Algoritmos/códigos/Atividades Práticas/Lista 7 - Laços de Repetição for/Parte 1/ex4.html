<!-- 


a) O usuário informa quantas xícaras de café com leite ele já tomou na vida   

b) Ao clicar em "Ver a quantidade", devem aparecer na tela X colheres com leite em pó e Y colheres de café em pó. Para cada xícara de café com leite informada em a) considere que o usuário usa 1 colher de leite e 2 de café. Assim você saberá os valores de X e Y.    
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    
    <div>
        <label for="ipt_qtd_cafe">Insira a quantidade de xícares de café com leite que você já tomou: </label>
        <input type="number" id="ipt_qtd_cafe">
    </div>
    <button onclick="verQuantidade()">Ver a quantidade</button>
    <div id="div_resultado"></div>

    <script>
        let i;
        let j;

        function verQuantidade() {
            let qtdCafe = Number(ipt_qtd_cafe.value);
            i = 1;
            j = 1;

            div_resultado.innerHTML = ""

            for (i; i <= qtdCafe; i++){
                div_resultado.innerHTML += `<img src="https://st2.depositphotos.com/2924751/9252/i/950/depositphotos_92528520-stock-photo-hand-holds-scoop-with-powdered.jpg" alt="Colher com leite em pó" width=350px>`;
            }

            for(j; j <= qtdCafe; j ++){
                div_resultado.innerHTML += `<img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgAn1zhMmhi1bI37zk9a4pz_NdT3mEJjhu-ScHpx2lQYADnMaketqbG6-ED5AjTSb5xUc9s78oI2iIcWtINnTakHwglUXpOA_dSBChPB1bab1JnuPiBlWCpYU89CS3hqkwZCnEb7Y6fme5J/s640/blogger-image--1443545596.jpg" alt="Colher com café" width=350px>`;
                div_resultado.innerHTML += `<img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgAn1zhMmhi1bI37zk9a4pz_NdT3mEJjhu-ScHpx2lQYADnMaketqbG6-ED5AjTSb5xUc9s78oI2iIcWtINnTakHwglUXpOA_dSBChPB1bab1JnuPiBlWCpYU89CS3hqkwZCnEb7Y6fme5J/s640/blogger-image--1443545596.jpg" alt="Colher com café" width=350px>`;
            }
        };

    </script>

</body>
</html>

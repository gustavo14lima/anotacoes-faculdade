<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Calculadora SPFlix</h1>

  <div>
      <p>Qualidade (720p ou 1080p ou 4K):</p>
      <input type="text" id="ipt_qualidade">
  </div>

  <div style="display: flex; gap: 50px">
    <div>
      <p>Telas simultâneas - Na mesma casa:</p>
      <input type="text" id="ipt_qtd_telas">
    </div>

    <div>
      <p>Telas extras - Fora da residência:</p>
      <input type="text" id="ipt_qtd_telas_extras">
    </div>
  </div>

  <div>
    <p>Quer fazer download ('sim' ou 'nao'):</p>
    <input type="text" id="ipt_download">
  </div>

  <p></p>
  <button onclick="exibirResultado()">Exibir Resultado</button>

  <p></p>
  <div id="div_mensagem"></div>

</body>
</html>
<script>
function exibirResultado() {
  let qualidade = ipt_qualidade.value;
  let qtdTelas = Number(ipt_qtd_telas.value);
  let qtdTelasExtras = Number(ipt_qtd_telas_extras.value);

  let valorTelaExtra = 12.90 
  let quebraLinha = `<br>`

  let valorBase = 0;
  let valorPlano = qtdTelasExtras * valorTelaExtra;

  if (qualidade == '720p'){
    valorBase += 15
  } else if(qualidade == '1080p'){
    valorBase += 20
  } else if (qualidade == '4K'){
    valorBase += 25
  } else {
    div_mensagem.innerHTML += `Qualidade inválida!`
  }

  if(qtdTelas <= 2){
    valorPlano += 10
  } else if (qtdTelas <= 4){
    valorPlano += 20
  }else{
    valorPlano += 30
  }

  let valorTotal = valorBase + valorPlano;
  let valorPessoas = qtdTelas + qtdTelasExtras;

  div_mensagem.innerHTML = `
    O valor base do seu plano é R$${valorBase.toFixed(2)} ${quebraLinha}
    O valor das telas do seu plano é R$${valorPlano.toFixed(2)} ${quebraLinha}
    Valor final: R$${valorTotal.toFixed(2)} ${quebraLinha}
    Se quiser dividir fica R$${(valorTotal / valorPessoas).toFixed(2)} para cada!
    ` 
}
</script>
</html>

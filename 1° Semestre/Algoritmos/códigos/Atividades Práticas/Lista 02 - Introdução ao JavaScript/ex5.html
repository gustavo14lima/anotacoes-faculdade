<!-- 
5. Opinião da mãe e da avó 

Crie um programa que:

    ✅ Tenha um campo para inserir a sua nota na escola
    ✅ Tenha um botão "opinião da avó"
    ✅ Tenha um botão "opinião da mãe"
    ✅ Ao clicar num botão "opinião da avó", abaixo dos botões, exibir "Muito bem, que neto inteligente, porque tirou X".
    ✅ Ao clicar num botão "opinião da mãe", abaixo dos botões, exibir "Não fez mais que tua obrigação com essa nota X".

         (Onde X é a nota que ele digitou.) 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5</title>
</head>
<body>
    
    <!-- Campo para inserir a sua nota na escola -->
    <div class="notaEscola">
        <label for="notaEscola">Insira a sua nota na escola</label>
        <input type="number" id="notaEscola">
    </div>

    <!-- Botão para a opinião da avó -->
    <button onclick="opiniaoAvo()">opinião da avó</button>
    <!-- Botão para a opinião da mãe -->
    <button onclick="opiniaoMae()">opinião da mãe</button>

</body>

<script>
    function opiniaoAvo() {
        alert(`Muito bem, que neto inteligente, porque tirou ${notaEscola.value}`);
    };
    function opiniaoMae() {
        alert(`Não fez mais que tua obrigação com essa nota ${notaEscola.value}`);
    };

</script>

</html>

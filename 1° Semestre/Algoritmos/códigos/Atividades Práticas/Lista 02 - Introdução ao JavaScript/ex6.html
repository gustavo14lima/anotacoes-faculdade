<!-- 
6. Farol 

Crie um programa que:

    ✅ Tenha três botões: "Pare", "Pense" e "Siga".
    ✅ Ao clicar no 1º botão, aparece abaixo dos botões a frase: "Pare e aguarde!". 
    ✅ Ao clicar no 2º botão, aparece abaixo dos botões a frase: "Pense se pode seguir ou se deve parar!". 
    ✅ Ao clicar no 3º botão, aparece abaixo dos botões a frase: "Pode seguir adiante".
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
</head>
<body>
    
    <!-- Botão "Pare" -->
    <button onclick="btnPare()">Pare</button>
    <!-- Botão "Pense" -->
    <button onclick="btnPense()">Pense</button>
    <!-- Botão "Siga" -->
    <button onclick="btnSiga()">Siga</button>

</body>

<script>
    function btnPare() {
        alert(`Pare e aguarde!`);
    };

    function btnPense() {
        alert(`Pense se pode seguir ou se deve parar!`);
    };
    
    function btnSiga() {
        alert(`Pode seguir adiante`);
    };

</script>

</html>

<!-- 
4. Onde Eu Moro 

Crie uma página que solicite ao usuário:

    ✅ Um campo para inserir o Nome da Rua/Avenida/Vila
    ✅ Um campo para inserir o Número da Casa
    ✅ Um botão com o texto "Onde eu moro"
    ✅ Ao clicar no botão, as seguintes mensagens devem aparecer:
        "Seu logradouro é X" (onde X é o nome da rua/avenida digitada)
        "O número do seu logradouro é Y" (onde Y é o número da casa informado) 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    
    <!-- Campo para inserir o nome da Rua/Avenida/Vila -->
    <div class="nomeResidencia">
        <label for="nomeResidencia">Insira o nome da Rua/Avenida/Vila</label>
        <input type="text" id="nomeResidencia">
    </div>

    <!-- Campo para inserir o número da casa -->
    <div class="numeroCasa">
        <label for="numeroCasa">Insira o Número da Casa</label>
        <input type="number" id="numeroCasa">
    </div>

    <!-- Botão -->
    <button onclick="ondeMoro()">Mostrar</button>

</body>

<script>
    function ondeMoro() {
        alert(`Seu logradouro é ${nomeResidencia.value}`);
        alert(`O número do seu logradouro é ${numeroCasa.value}`);
    };

</script>

</html>

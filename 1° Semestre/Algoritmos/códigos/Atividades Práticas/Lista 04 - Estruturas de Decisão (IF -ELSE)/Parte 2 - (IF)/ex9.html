<!-- 
9. Tempo Gasto com Séries

Estima-se que os usuários de conteúdo de Streaming gastem cerca de 100 milhões de horas por dia nesse tipo de entretenimento.  

Em média um episódio de seriado americano do estilo SITCOM (Friends, How I Met Your Mother, Dois Homens e Meio, etc.) tem 22min de duração.  

Sabendo disso, crie um programa o qual:  

a) Peça ao usuário para informar a última série (SITCOM) que ele assistiu 

b) Peça ao usuário para informar o total de episódios que ele já assistiu da série 

c) Tenha um botão "Verificar nível" que exiba abaixo dele a seguinte frase:  

     "Vejo que você gosta da série X"   

E se o usuário já gastou mais de 30 horas na série informada, exiba também: "Uau, você realmente gosta dessa série!".  

Obs: Considere 22min como o tempo de duração de 1 episódio.   
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempo Gasto com Séries</title>
</head>
<body>
    
    <div>
        <label for="id_ultima_serie">Insira a última série que você assistiu: </label>
        <input type="text" id="id_ultima_serie">
    </div>
    <div>
        <label for="id_total_episodios">Insira o total de episódios que ele já assistiu da série: </label>
        <input type="number" id="id_total_episodios">
    </div>

    <button onclick="verificarNivel()">Verificar nível</button>

    <h4 id="id_resultado"></h4>

</body>

<script>
    function verificarNivel() {
        let ultimaSerie = id_ultima_serie.value;
        let totalEpisodios = Number(id_total_episodios.value);
        let duracaoEpisodio = 22;

        let duracaoTotal = totalEpisodios * duracaoEpisodio;

        id_resultado.innerHTML = `Vejo que você gosta da série ${ultimaSerie}`;

        // 30 horas, transformados em minutos são 1800
        if (duracaoTotal > 1800) {
            id_resultado.innerHTML = `Uau, você realmente gosta dessa série!`;
        }
        
    }
</script>

</html>

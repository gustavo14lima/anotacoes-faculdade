<!-- 

1. Idade para a Festa

Crie um programa que:  

a) Pergunte ao usuário sua idade.  

b) Ao clicar num botão "Ir pra festa":  

   b1) Caso a idade seja menor que 18, deve aparecer um alert com a frase "Pedir permissão pro responsável" 

   b2) Sempre vai aparecer um alert com a palavra "#partiuFesta" ao final  

OBS: caso tenha 18 anos ou mais, deve somente a segunda mensagem. 
 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idade para a Festa</title>
</head>
<body>

    <div>
        <label for="id_idade">Digite a sua idade: </label>
        <input type="number" id="id_idade">
    </div>
    <button onclick="calcularPermissao()">Ir para festa</button>

</body>

<script>
    function calcularPermissao() {
        let idade = Number(id_idade.value);

        if (idade < 18){
            alert(`Pedir permissão pro responsável`);
        }
        alert(`#partiuFesta`);
    };

</script>

</html>

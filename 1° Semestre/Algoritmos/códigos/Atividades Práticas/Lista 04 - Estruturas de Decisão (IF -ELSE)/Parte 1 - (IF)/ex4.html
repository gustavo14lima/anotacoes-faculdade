<!-- 
4. Divisão Justa da Pizza

Um grupo de amigos costuma se reunir na casa de um deles para comer pizza. Só que eles têm um trato de que o valor da pizza, quando dividido entre os amigos, não deve passar de 20,00 por amigo. Ajude-os criando um programa o qual: 

a) Pergunte o valor da pizza 

b) Pergunte a quantidade de amigos reunidos 

c) Ao clicar em "Rola a pizza?", calcule e exiba o valor que cada amigo vai pagar na pizza com uma frase na página como esta "Cada amigo vai pagar R$X pela pizza" 

d) Somente caso o valor por amigo passe de R$20,00, exiba também a frase "Deu ruim! Pizza muito cara!"  
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisão Justa de Pizza</title>
</head>
<body>
    
    <div>
        <label for="id_valor_pizza">Insira o valor da pizza: </label>
        <input type="number" id="id_valor_pizza">
    </div>
    <div>
        <label for="id_qtd_amigos">Insira a quantidade de amigos: </label>
        <input type="number" id="id_qtd_amigos">
    </div>

    <button onclick="calcularPizza()">Rola a pizza</button>

    <h4 id="id_resultado"></h4>

</body>

<script>
    function calcularPizza() {
        let valorPizza = Number(id_valor_pizza.value);
        let qtdAmigos = Number(id_qtd_amigos.value);

        let valorPorAmigo = valorPizza / qtdAmigos;
        id_resultado.innerHTML = `Cada amigo vai pagar R$${valorPorAmigo} pela pizza`;

        if (valorPorAmigo > 20) {
            id_resultado.innerHTML += `Deu ruim! Pizza muito cara!`
        }
    };

</script>

</html>

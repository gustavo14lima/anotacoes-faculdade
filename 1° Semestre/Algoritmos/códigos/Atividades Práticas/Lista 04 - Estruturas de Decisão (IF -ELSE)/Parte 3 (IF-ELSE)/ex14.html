<!-- 

14. Criar um programa que auxilie uma Autoescola a identificar possíveis novos alunos. 

a) Solicite o nome e a idade de uma pessoa 

b) Ao clicar no botão "Avaliar aluno", se a pessoa tiver 18 anos ou mais emita a mensagem "NOME, vamos tirar a CNH?", mas caso contrário, emita a mensagem "NOME, vai jogar PlayStation!" 
 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 14</title>
</head>
<body>
    
    <div>
        <label for="id_nome">Insira o nome da pessoa: </label>
        <input type="text" id="id_nome">
    </div>
    <div>
        <label for="id_idade">Insira a idade da pessoa: </label>
        <input type="number" id="id_idade">
    </div>

    <button onclick="avaliarAluno()">Avaliar aluno</button>
    <h4 id="id_resultado"></h4>

</body>

<script>
    function avaliarAluno() {
        let nome = id_nome.value;
        let idade = Number(id_idade.value);

        if (idade >= 18) {
            id_resultado.innerHTML = `${nome}, vamos tirar a CNH?`;
        } else {
            id_resultado.innerHTML = `${nome}, vai jogar PlayStation!`;
        }
    }
</script>

</html>

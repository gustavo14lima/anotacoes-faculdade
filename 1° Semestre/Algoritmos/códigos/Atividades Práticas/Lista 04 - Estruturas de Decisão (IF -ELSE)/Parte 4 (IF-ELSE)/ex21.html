<!-- 
21. Crie um programa o qual: 

a) Pergunte ao usuário qual sua meta de economia 

b) Pergunte ao usuário quanto tem guardado 

c) Ao clicar em "Analisar economia"... 

d) Caso a meta tenha sido alcançada ou ultrapassada, exibir, abaixo do botão, a frase Parabéns, meta alcançada!. Caso a meta tenha sido ultrapassada, exibir também a frase Meta ultrapassada em X (onde X é a diferença entre a economia e a meta) 

e) Caso a meta ainda não tenha sido alcançada, exibir, abaixo do botão, a frase Força! Ainda em busca da meta! Falta X (onde X é a diferença entre a meta e a economia) 
 -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 21</title>
</head>
<body>

    <div>
        <label for="id_meta">Insira a sua meta de economia: </label>
        <input type="number" id="id_meta">
    </div>
    <div>
        <label for="id_dinheio_guardado">Insira a quantidade de dinheiro guardado: </label>
        <input type="number" id="id_dinheio_guardado">
    </div>

    <button onclick="analisarEconomia()">Analisar economia...</button>
    <h4 id="id_resultado"></h4>

</body>

<script>
    function analisarEconomia() {
        let meta = Number(id_meta.value);
        let dinheiroGuardado = Number(id_dinheio_guardado.value);

        if (dinheiroGuardado >= meta){
            id_resultado.innerHTML = `Parabéns, meta alcançada!`;
            if (dinheiroGuardado > meta) {
                id_resultado.innerHTML += `Meta ultrapassada em ${dinheiroGuardado - meta}`;
            }
        } else {
            id_resultado.innerHTML = `Força! Ainda em busca da meta! Falta ${meta - dinheiroGuardado}`;
        }
    }
</script>

</html>

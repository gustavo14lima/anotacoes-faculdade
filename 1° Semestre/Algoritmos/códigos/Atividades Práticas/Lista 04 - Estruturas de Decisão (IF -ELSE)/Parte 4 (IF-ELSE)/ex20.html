<!-- 
20. Crie um programa o qual: 

a) Solicite a quantidade de homens e mulheres num elevador 

b) Ao clicar num botão "Ligar elevador", calcule o peso total no elevador, considerando que um homem pesa em média 90kg e uma mulher 70kg 

c) Caso o peso seja até 500, exiba uma frase na cor verde abaixo do botão com a frase Elevador vai se mover, pois está com Xkg 

d) Caso o peso seja maior que 500, exiba uma frase na cor vermelha abaixo do botão com a frase Alguém precisa descer. Precisa perder Xkg para mover o elevador  
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 20</title>
</head>
<body>
        
    <div>
        <label for="id_qtd_homens">Insira a quantidade de homens</label>
        <input type="number" id="id_qtd_homens">
    </div>
    <div>
        <label for="id_qtd_mulheres">Insira a quantidade de mulheres</label>
        <input type="number" id="id_qtd_mulheres">
    </div>

    <button onclick="ligarElevador()">Ligar elevador</button>
    <h4 id="id_resultado"></h4>

</body>

<script>

    function ligarElevador() {
    let qtdHomens = Number(id_qtd_homens.value);
    let qtdMulheres = Number(id_qtd_mulheres.value);

    let pesoHomem = 90;
    let pesoMulher = 70;

    let pesoTotalHomem = qtdHomens * pesoHomem;
    let pesoTotalMulheres = qtdMulheres * pesoMulher;

    let peso = pesoTotalHomem + pesoTotalMulheres;

    if (peso <= 500){
        id_resultado.innerHTML = `<h4 style="color: green;"> Elevador vai se mover, pois está com ${peso}kg`; 
    } else {
        id_resultado.innerHTML = `<h4 style="color: red;"> Alguém precisa descer. Precisa perder ${peso - 500}kg para mover o elevador`; 
    }

    };

</script>

</html>

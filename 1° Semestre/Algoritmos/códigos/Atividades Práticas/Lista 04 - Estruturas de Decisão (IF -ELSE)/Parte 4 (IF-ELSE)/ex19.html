<!-- 

19. Crie um programa o qual: 

a) Solicita a temperatura do ambiente 

b) Ao clicar em "Verificar clima", determine se o clima está: 

    Apropriada p/ conservar alimento - Caso a temperatura for menor que 10 

    Inapropriada p/ conservar alimento - Caso a temperatura for a partir de 10 

c) Em caso de temperatura apropriada, exiba a figura de um alimento em bom estado. Caso contrário, exiba a imagem de um alimento estragado 
 
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 19</title>
</head>
<body>
    
    <div>
        <label for="id_temperatura">Insira a temperatura do ambiente: </label>
        <input type="number" id="id_temperatura">
    </div>

    <button onclick="verificarClima()">Verificar clima</button>
    <h4 id="id_resultado"></h4>

</body>

<script>
    function verificarClima() {
        let temperatura = Number(id_temperatura.value);

        if (temperatura >= 10) {
            id_resultado.innerHTML = `Apropriada para conservar alimento`;
        } else {
            id_resultado.innerHTML = `Inapropriada para conservar alimento`;
        }
    };

</script>

</html>

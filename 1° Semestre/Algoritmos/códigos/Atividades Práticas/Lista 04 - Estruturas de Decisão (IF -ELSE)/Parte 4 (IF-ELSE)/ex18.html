<!-- 
18. Crie um programa o qual: 

a) Solicite 2 notas de um aluno 

b) Ao clicar em "Verificar situação", calcule sua média e... 

c) Caso a média seja a partir de 6, exiba "Parabéns, aprovado!" 

d) Caso a média seja menor que 6, exiba "Tente outra vez..."  
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 18</title>
</head>
<body>
        
    <div>
        <label for="id_nota1">Insira a primeira nota: </label>
        <input type="number" id="id_nota1">
    </div>
    <div>
        <label for="id_nota2">Insira a segunda nota: </label>
        <input type="number" id="id_nota2">
    </div>

    <button onclick="verificarSituacao()">Verificar situação</button>
    <h4 id="id_resultado"></h4>

</body>

<script>
    function verificarSituacao() {
        let nota1 = Number(id_nota1.value);
        let nota2 = Number(id_nota2.value);
        let media = (nota1 + nota2) / 2;

        if (media >= 6) {
            id_resultado.innerHTML = `Parabéns, aprovado!`;
        } else {
            id_resultado.innerHTML = `Tente outra vez...`;
        }
    };

</script>

</body>
</html>

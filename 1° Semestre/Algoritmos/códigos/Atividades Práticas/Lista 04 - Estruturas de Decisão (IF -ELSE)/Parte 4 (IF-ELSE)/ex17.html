<!-- 

17. Crie um programa o qual: 

a) Solicita a frequência do aluno 

b) Ao clicar em "Analisar frequência", deve aparecer, abaixo dele: 

    A imagem de um turista, caso a frequência for menor que 50 OU 

    A imagem de um aluno estudioso, caso a frequência for a partir de 50 
 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 17</title>
</head>
<body>
    
    <div>
        <label for="id_frequencia">Insira a frequência do aluno: </label>
        <input type="number" id="id_frequencia">
    </div>

    <button onclick="analisarFrequencia()">Analisar frequência</button>
    <div id="id_resultado"></div>
    
</body>

<script>
    function analisarFrequencia() {
        let frequencia = Number(id_frequencia.value);

        if (frequencia >= 50) {
            id_resultado.innerHTML = ` <img src="https://www.google.com/url?sa=t&source=web&rct=j&url=https%3A%2F%2Fpracticaltyping.com%2F2025%2F02%2F17%2Fmyers-briggs-types-in-dr-stone-senku-ishigami-entj%2F&ved=0CBYQjRxqFwoTCIDr_p6C6ZIDFQAAAAAdAAAAABAH&opi=89978449" alt="Imagem do senku"> `
        } else {
            id_resultado.innerHTML = `<img src="https://www.google.com/url?sa=t&source=web&rct=j&url=https%3A%2F%2Fwww.tecmundo.com.br%2Fminha-serie%2F602004-apos-mais-de-20-anos-ator-de-dexter-vira-meme-novamente-por-causa-da-serie.htm&ved=0CBYQjRxqFwoTCMig9tCC6ZIDFQAAAAAdAAAAABAH&opi=89978449" alt="Motorista">`
        }
    };

</script>

</html>

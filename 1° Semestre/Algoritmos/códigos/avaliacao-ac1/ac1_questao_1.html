<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Questão 1</title>
</head>
<body>
   <h2>Questão 1</h2>

   <span>Quantidade de Energia Consumida (kWh): </span>
   <input type="text" id="input_kwh"> <br>

   <button onclick="calcular()">Calcular Despesa</button>

   <div id="div_mensagem"></div>
</body>
</html>

<script>
/* Faça sua lógica aqui! Não altere o HTML. */
function calcular() {
   let kwh = Number(input_kwh.value);
   
   if (kwh < 0){
      div_mensagem.innerHTML = `A quantidade de energia consumida (kWh) não pode ser negativa...`
   } else if (kwh < 100){
      div_mensagem.innerHTML = `Com o consumo de ${kwh} kWh, a conta de energia totaliza R$ ${(kwh * 0.95).toFixed(2)}`
   } else {
      div_mensagem.innerHTML = `Com o consumo de ${kwh} kWh, a conta de energia totaliza R$ ${(kwh * 1.50).toFixed(2)}`
   }
}
</script>

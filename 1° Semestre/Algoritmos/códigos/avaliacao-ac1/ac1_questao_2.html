<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Questão 2</title>
</head>
<body>
   <h2>Questão 2</h2>
   
   <span>Quantidade de Energia Consumida (kWh): </span>
   <input type="text" id="input_kwh"> <br>

   <span>Bandeira Tarifária de Energia: </span>
   <input type="text" id="input_bandeira"> <br>

   <button onclick="calcular()">Calcular Despesa</button>

   <div id="div_mensagem"></div>
</body>
</html>

<script>
/* Faça sua lógica aqui! Não altere o HTML. */
function calcular() {
   let kwh = Number(input_kwh.value);
   let bandeira = input_bandeira.value;
   let valorKwh = 0;

   if (bandeira == "verde"){
      valorKwh = 0.75;
   } else if (bandeira == "amarela"){
      valorKwh = 0.90;
   } else if (bandeira == "vermelha"){
      valorKwh = 1.15;
   } else {
      div_mensagem.innerHTML = `Valor de bandeira incorreto! Tente entre: amarela, vermelha e verde`;
   }

   let valorConsumido = kwh * valorKwh;

   if (kwh < 0){
      div_mensagem.innerHTML = `A quantidade de energia consumida (kWh) não pode ser negativa...`;
   } else if (kwh < 100){
      valorConsumido -= 15;
   }

   div_mensagem.innerHTML = `Com o consumo de ${kwh} kWh na bandeira ${bandeira}, a conta de energia totaliza R$ ${valorConsumido.toFixed(2)}`;

}
</script>

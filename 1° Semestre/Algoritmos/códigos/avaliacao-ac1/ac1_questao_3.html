<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Questão 3</title>
</head>
<body>
   <h2>Questão 3</h2>
   
   <span>Quantidade de MB de internet consumida no plano</span>
   <input type="text" id="input_mb"> <br>

   <span>Indicação se há telefone vinculado ao plano</span>
   <input type="text" id="input_indicacao"> <br>

   <button onclick="calcular()">Calcular Despesa</button>

   <div id="div_mensagem"></div>
</body>
</html>

<script>
/* Faça sua lógica aqui! Não altere o HTML. */
function calcular() {
   let mb = Number(input_mb.value);
   let indicacao = input_indicacao.value;

   let valorPlano = mb;

   if (mb < 0){
      div_mensagem.innerHTML = `A quantidade MB de internet consumida não pode ser negativa...`;
   } else if (mb <= 200){
      valorPlano += 40;
   } else{
      valorPlano -= 40;
   }

   div_mensagem.innerHTML = ` Com o consumo de ${mb} MB de internet, o valor base do plano de internet é R$ ${valorPlano.toFixed(2)}`
   
   if (indicacao == "sim"){
      div_mensagem.innerHTML += `, totalizando R$ ${(valorPlano *= 1.20).toFixed(2)} com telefone.`
   } else if (indicacao == "não"){
   } else {
      div_mensagem.innerHTML = `Operação inválida, utilize apenas "sim" ou "não"`
   }

   

}
</script>

<!-- Tamplate padrão = ! -->

<!-- especifica ao navegador que esse arquivo é html, um container que especifica que isso é html -->
<!DOCTYPE html>
<!-- linguagem do site -->
<html lang="en">
<head>
    <!-- configuração do teclado do site -->
    <meta charset="UTF-8">
    <!-- visualização do site -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- altera o título do site -->
    <title>Teste</title>
</head>
<!-- CSS inline -->
 <!-- Para cores, posso usar o nome em inglês, RGB ou Hexadecimal -->
<body style="background-color: #000; color: #FFF;">
    
    <!-- Div = caixas para separação/organização -->
     <div>
         <h1>Minha "Primeira" Página</h1>
         <!-- Atributo = uma caracterisitca que a gente da para a tag -->
         <!-- src = da onde vai vir a imagem -->
         <!-- alt = texto alternativo -->
         <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTv5uERjvgRtErR1QJVgWQckP6cpPzk5aehUQ&s" alt="Imagem do Oliver Aiku">
    </div>

    <div>
        <label for="">Nome: </label>
        <input type="text" id="nomeUsuario">
        <button onclick="alert('Olá ' + nomeUsuario.value)">Dizer "oi"</button>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Aula CSS - 1</title>
</head>

<style>

.card{
	width:500px; 
	height: fit-content; 
	background-color: aliceblue; 
	border: solid 2px navy; 
	margin: 20px; 
	padding: 20px;
}

.border {
	border-radius: 20px; 

}
.icone1 {
	width: 100px; 
	height: 100px;
	border-radius: 25px;
	background-image: url('https://cdn-icons-png.flaticon.com/512/706/706830.png');
	background-size: cover;
}

.icone2 {
	width: 100px; 
	height: 100px;
	border-radius: 25px;
	background-image: url('https://cdn-icons-png.flaticon.com/256/3681/3681928.png');
	background-size: cover;
}

.text {
	font-family: Arial, Helvetica, sans-serif;
}

.title {
	font-size: 30px;
}
.main-color{
	color: navy;

}

p{
	font-size: 15px	;
}

.italic {
	font-style: italic
}

</style>

<body>

	<!-- fit-content = a div se ajusta de acordo com o conteúdo -->
	<!-- margin = espaçamento externo da borda -->
	<!-- padding = espaçamento internto da borda  -->
	<div class="card border">

		<div class="icone1 border">
		</div>

		<div>
			<!-- font-family: Arial, Helvetica, sans-serif -> se a Arial não funcionar, utilize a Helvetica. Se a Helvetica, utilize a sans-serif -->
			<h1 class="text title">
				Meu nome é: <span class="main-color">Adriana</span>
			</h1>

			<p class="text">
				Mensagem: <span class="main-color italic">A vida não é um morango!</span>
			</p>
		</div>
	</div>

	<div class="card border">

		<div class="icone2 border">
		</div>

		<div>
			<h1 class="text title">
				Meu nome é: <span  class="main-color">Hugo</span>
			</h1>

			<p class="text">
				Mensagem: <span class="main-color italic">Um dia é da caça, o outro é do caçador.</span>
			</p>
		</div>
	</div>

</body>

</html>

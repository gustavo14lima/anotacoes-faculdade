<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambiente de Testes</title>
</head>
<body>
    <div>
        <canvas id="grafico-linha">
            <p>Tudo o que estiver dentro do `canvas`, como por exemplo, ela tag de parágrafo, só vai aparecer caso algo com a tag ou script canvas de errado</p>
        </canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
    const ctx = document.getElementById('grafico-linha');

        new Chart(ctx, {
            type: 'line',
            data: {
            labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
            datasets: [{
                label: 'Valor 1',
                data: [12, 19, 3, 5, 2, 3],
                borderWidth: 2,
                borderColor: '#36A2EB',
                backgroundColor: '#9BD0F5',
            },
            {
                label: 'Valor 2',
                data: [23, 1, 2, 17, 67, 2],
                borderWidth: 2,
                borderColor: '#F00',
                backgroundColor: '#F11',
            }]
            },
            options: {
            scales: {
                y: {
                beginAtZero: true
                }
            }
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudando o ChartJS</title>
</head>
<body>
    <style>
        .grafico {
            width: 50%; 
        }
    </style>

    <div class="grafico">
        <!-- Tag canvas está sendo responsável por apresentar o gráfico -->
        <canvas id="myChart"></canvas>
    </div>

    <!-- Importando a biblioteca ChartJS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // estou falando que a constante 'ctx' é o elemento com o id 'myChart'
        const ctx = document.getElementById('myChart');

        new Chart(ctx, {
            // type -> o tipo de gráfico que eu irei utilizar
            type: 'bar',
            // constante JSON (chave-valor)
            data: {
            // labels define as dimensões (valores que ficam no eixo X)
            labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
            // datasets são as metricas do gráfico. É ele onde eu crio novas linhas, novas barras (depende do seu gráfico)
            datasets: [{
                // legenda do gráfico
                label: 'Essa é a lageneda da cor azul (legenda das barras)',
                // 'data' são os dados. Ou seja, a primeira barra (vermelho) é 12.
                // caso eu não teha um valor para uma dimensão, eu coloco 'null'
                data: [12, 19, 3, 5, 2, 3],
                // grossura da borda da barra (por exemplo)
                borderWidth: 1,
                // cor da borda da barra
                borderColor: '#36A2EB',
                // cor da própria barra
                backgroundColor: '#9BD0F5',
            },
            // adicionando outro conjunto de barras no gráfico
            {
                label: 'Essa é a lageneda da cor vermelho (legenda das barras)',
                data: [23, 1, 2, 17, 67, 2],
                borderWidth: 2,
                borderColor: '#F00',
                backgroundColor: '#F11',
            }
        ]
        },
        options: {
            scales: {
                y: {
                    // pergunta se você quer que o eixo y comece em 0 ou não
                    beginAtZero: true,
                    // aqui eu especifico de qual número começa as metricas
                    min: 0,
                    // especificação de qul é a minha metrica máxima
                    max: 100,
                    // de quanto em quanto eu estou pulando na métrica
                    // por exemplo, como esse gráfico começa em 0, o próximo seria 5, depois 10 e assim por diante 
                    ticks: {
                        stepSize: 5
                    }
                }
            }
            }
        });
    </script>
</body>
</html>
